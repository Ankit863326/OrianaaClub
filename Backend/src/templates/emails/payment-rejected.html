<!-- Phase 4: Tell a member when an administrator could not verify a bank transfer. -->
<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bank transfer update</title></head>
  <body style="margin:0;background:#101214;color:#f4f0e6;font-family:Arial,sans-serif">
    <main style="max-width:560px;margin:40px auto;padding:32px;background:#191a1b;border:1px solid #8f7548">
      <p style="color:#c9a96e;letter-spacing:3px">ORIANAA CLUB</p>
      <h1 style="font-weight:400">Bank transfer update</h1>
      <p>Hello {{firstName}},</p>
      <p>We could not approve the bank transfer submitted for your membership. Please contact our membership team if you need help resolving this.</p>
      <p><strong>Reason:</strong> {{reason}}</p>
      <p style="color:#b7b3a9">Orianaa Club Membership Team</p>
      <p style="margin:24px 0 0;padding-top:14px;border-top:1px solid #8f7548;color:#c9a96e;font-size:12px;text-align:center;">OrianaaClub · Luxury Membership</p>
      <div style="text-align:center;">{{supportEmail}}</div>
    </main>
  </body>
</html>
