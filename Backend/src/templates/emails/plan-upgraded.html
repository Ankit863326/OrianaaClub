<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OrianaaClub plan upgrade confirmed</title>
  </head>
  <body style="margin:0;padding:0;background:#f2f4f1;font-family:Arial,Helvetica,sans-serif;color:#18352a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px;background:#f2f4f1;">
      <tr><td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#fff;border:1px solid #e5e7e3;">
          <tr><td align="center" style="padding:26px 20px;background:#123c2e;color:#d8bd72;font-family:Georgia,'Times New Roman',serif;font-size:29px;">OrianaaClub</td></tr>
          <tr><td style="padding:38px 34px 40px;">
            <h1 style="margin:0 0 20px;font-family:Georgia,'Times New Roman',serif;font-size:28px;color:#18352a;">Your plan upgrade is confirmed</h1>
            <p style="font-size:16px;line-height:1.6;">Hi {{firstName}},</p>
            <p style="font-size:15px;line-height:1.7;color:#5d675f;">Your membership has been upgraded to <strong>{{planName}}</strong>.</p>
            <p style="font-size:15px;line-height:1.7;color:#5d675f;">Amount paid (including GST): <strong>₹{{amountPaid}}</strong></p>
            <p style="font-size:15px;line-height:1.7;color:#5d675f;">Points added: <strong>{{pointsAdded}}</strong></p>
            <p style="font-size:15px;line-height:1.7;color:#5d675f;">New points balance: <strong>{{newBalance}}</strong></p>
            <p style="font-size:14px;line-height:1.7;color:#5d675f;">Thank you for being a member of OrianaaClub.</p>
          </td></tr>
        </table>
        <div align="center">{{supportEmail}}</div>
      </td></tr>
    </table>
  </body>
</html>
