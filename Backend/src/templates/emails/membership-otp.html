<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify your Orianaa Club email</title>
  </head>
  <body style="margin:0;padding:32px 12px;background:#f2f4f1;font-family:Arial,Helvetica,sans-serif;color:#18352a;">
    <main style="max-width:560px;margin:0 auto;padding:32px;background:#fff;border:1px solid #e5e7e3;">
      <p style="margin:0;color:#123c2e;font-family:Georgia,'Times New Roman',serif;font-size:26px;">OrianaaClub</p>
      <h1 style="margin:24px 0 12px;font-family:Georgia,'Times New Roman',serif;font-size:25px;">Verify your email</h1>
      <p style="font-size:15px;line-height:1.6;">Hi {{firstName}}, enter this one-time code to continue your membership application:</p>
      <p style="margin:24px 0;padding:16px;background:#f7f5ef;text-align:center;font-size:30px;font-weight:bold;letter-spacing:8px;">{{code}}</p>
      <p style="font-size:13px;line-height:1.6;color:#5d675f;">This code expires in {{expiry}}. If you did not request it, you can ignore this email.</p>
    </main>
  </body>
</html>
