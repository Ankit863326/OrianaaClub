<!-- Phase 5b: Notify the club team about a newly received public enquiry. -->
<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New enquiry</title></head>
  <body style="margin:0;background:#101214;color:#f4f0e6;font-family:Arial,sans-serif">
    <main style="max-width:600px;margin:36px auto;padding:30px;background:#191a1b;border:1px solid #8f7548">
      <p style="color:#c9a96e;letter-spacing:3px">ORIANAA CLUB</p>
      <h1 style="font-weight:400">A new enquiry has arrived</h1>
      <p><strong>Type:</strong> {{type}}</p>
      <p><strong>Name:</strong> {{name}}</p>
      <p><strong>Email:</strong> {{email}}</p>
      <p><strong>Mobile:</strong> {{mobile}}</p>
      <p><strong>Message:</strong></p>
      <p style="white-space:pre-wrap">{{message}}</p>
      <p style="margin:24px 0 0;padding-top:14px;border-top:1px solid #8f7548;color:#c9a96e;font-size:12px;text-align:center;">OrianaaClub · Luxury Membership</p>
      <div style="text-align:center;">{{supportEmail}}</div>
    </main>
  </body>
</html>
