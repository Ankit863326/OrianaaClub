<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f6f3;padding:32px 16px;font-family:Arial,sans-serif;color:#24332b;">
    <main style="max-width:600px;margin:0 auto;background:#fff;border:1px solid #e3e9e4;border-radius:16px;padding:32px;">
      <p style="margin:0 0 8px;color:#987b35;font-size:12px;font-weight:bold;letter-spacing:2px;">ORIANAA CLUB</p>
      <h1 style="margin:0 0 20px;font-size:26px;">{{eventTitle}}</h1>
      <p style="white-space:pre-line;line-height:1.7;">{{eventDescription}}</p>
      <div style="margin-top:24px;padding:16px;border-radius:12px;background:#f4f6f3;line-height:1.8;">
        <strong>{{eventDate}}</strong><br>
        {{eventTime}}<br>
        {{eventLocation}}
      </div>
      <p style="margin:24px 0 0;font-size:13px;color:#68736b;">We look forward to seeing you.</p>
    </main>
  </body>
</html>
